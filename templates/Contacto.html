<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Contacto</title>
  <style>
    /* Estilos compactos (puedes adaptar) */
    body{font-family:Arial;margin:30px;background:#f7f9fc}
    .container{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
    label{font-weight:bold}
    input, textarea{width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px}
    button{background:#003366;color:#fff;padding:10px 14px;border:none;border-radius:4px;cursor:pointer}
  </style>
</head>
<body>
  <div class="container">
    <h2>Contacto - Departamento de RH</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Enviar</button>
    </form>

    {% if enviado %}
      <p style="color:green;">Correo enviado correctamente.</p>
    {% endif %}
  </div>
</body>
</html>
